<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Echo – Video zu MP3 Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&family=Fraunces:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Sora:wght@400;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<style>
:root{--h:268;--glow:1;--fs:15;--den:8px;--cvs:46px;--cvr:13px;--lb:.09;--ts:.55;--bgb:0px;--sat:1;--dim:0;--sp:50;--pa:30;--bl:8px;--rad:18px;--ff:"Outfit","Segoe UI",system-ui,sans-serif;--ac:hsl(var(--h) 85% 62%);--ac2:hsl(calc(var(--h) + var(--sp)) 90% 60%);--g:linear-gradient(135deg,var(--ac),var(--ac2));--bg:#0b0a14;--panel:rgba(14,12,26,calc(var(--pa)/100));--line:rgba(255,255,255,var(--lb));--tx:#f4f2fc;--mu:#a6a2c2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:calc(var(--fs)*1px)/1.4 var(--ff);text-shadow:0 1px 10px rgba(0,0,0,var(--ts));overflow:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;transition:.18s}
button:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;filter:blur(var(--bgb)) saturate(var(--sat))}body::before{content:"";position:fixed;inset:0;z-index:1;background:rgba(0,0,0,var(--dim));pointer-events:none}
.app{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:var(--sw,250px) 1fr;grid-template-rows:minmax(0,1fr) auto;gap:14px;padding:14px}
aside,main,footer{background:var(--panel);backdrop-filter:blur(var(--bl)) saturate(1.4);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.4);border:1px solid var(--line);border-radius:calc(var(--rad) + 6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 60px rgba(0,0,0,.35);transition:opacity .4s}
aside{padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.logo{font-size:32px;font-weight:700;letter-spacing:-.04em;margin:0 8px 18px;display:flex;align-items:center;gap:10px}
.logo:before{content:"";width:14px;height:14px;border-radius:50%;background:var(--g);box-shadow:0 0 18px var(--ac),0 0 40px var(--ac2)}
.nav{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:14px;color:var(--mu);font-weight:500}
.nav i{font-style:normal;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-size:15px}
.nav:hover{color:var(--tx);background:rgba(255,255,255,.06)}.nav.on{color:var(--tx);background:rgba(255,255,255,.1)}.nav.on i{background:var(--g);color:#111}
.drop{margin:10px 0 4px;border-radius:16px;padding:14px;text-align:center;cursor:pointer;color:var(--tx);background:var(--g);color:#0d0b18;text-shadow:none;transition:.2s;box-shadow:0 10px 30px hsl(var(--h) 90% 55%/calc(.35*var(--glow)))}
.drop:hover,.drop.over{transform:translateY(-2px) scale(1.02);filter:brightness(1.1)}
.drop b{display:block;font-size:16px}.drop span{display:block;font-size:12px;opacity:.75;margin-top:2px}
#status{font-size:12.5px;color:var(--mu);min-height:34px;padding:0 8px}
#bar{height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;display:none;margin:0 8px}#bar i{display:block;height:100%;width:0;background:var(--g);transition:width .15s}
.sp{flex:1}
main{padding:26px 28px;overflow:auto;min-height:0;scrollbar-width:thin}
.hero{display:flex;gap:24px;align-items:flex-end;padding-bottom:20px}
.hero small{letter-spacing:.22em;font-size:12px;color:var(--mu);font-weight:600}
h2{margin:4px 0 8px;font-size:clamp(34px,5vw,64px);letter-spacing:-.045em;line-height:1;font-weight:700}
#meta{margin:0;color:var(--mu)}
.cv{position:relative;width:var(--cvs);height:var(--cvs);border-radius:var(--cvr);flex:none;display:grid;place-items:center;font-weight:700;font-size:18px;text-shadow:none;color:rgba(255,255,255,.92);background:linear-gradient(135deg,hsl(var(--c) 80% 58%),hsl(calc(var(--c) + 55) 85% 36%));box-shadow:0 8px 20px hsl(var(--c) 80% 50%/.35)}
.hero .cv{width:136px;height:136px;border-radius:28px;font-size:60px;--c:var(--h)}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding:12px 0;background:rgba(0,0,0,.5);border-radius:inherit}
.eq i{width:4px;border-radius:2px;background:var(--tx);animation:eq .9s infinite ease-in-out;height:30%}.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{50%{height:100%}}.row.pl .eq{display:flex}
.bar2{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.bigplay{width:60px;height:60px;border-radius:50%;background:var(--g);color:#0d0b18;font-size:22px;text-shadow:none;box-shadow:0 12px 34px hsl(var(--h) 90% 55%/calc(.5*var(--glow)))}.bigplay:hover{transform:scale(1.1)}
.search{flex:1;max-width:340px;margin-left:auto;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:30px;padding:11px 18px}
.row{display:grid;grid-template-columns:var(--cvs) 1fr auto auto;gap:14px;align-items:center;padding:var(--den) 12px;margin:2px 0;border-radius:16px;cursor:pointer;user-select:none;-webkit-user-select:none;border:1px solid transparent}
.row:hover{background:rgba(255,255,255,.07)}.row.cur{background:linear-gradient(90deg,hsl(var(--h) 80% 60%/.2),transparent);border-color:var(--line)}
.row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}.row.cur .t{color:var(--ac);font-weight:700}
.row .t input{user-select:text;-webkit-user-select:text;width:100%;background:rgba(255,255,255,.14);border:1px solid var(--ac);border-radius:10px;padding:5px 10px;outline:0}
.row .d{color:var(--mu);font-variant-numeric:tabular-nums;font-size:13px;min-width:38px;text-align:right}
.acts{display:flex;gap:2px;opacity:0;transition:.18s}.row:hover .acts,.row.cur .acts,.row:focus-within .acts{opacity:1}
.acts button{padding:6px 9px;border-radius:10px;color:var(--mu)}.acts button:hover{background:rgba(255,255,255,.14);color:var(--tx)}
.acts .pp{color:var(--tx)}.acts .lp.on{color:var(--ac);background:rgba(255,255,255,.14)}.acts .lk.on{color:var(--ac2)}
@media(hover:none){.acts{opacity:1}}
.empty{color:var(--mu);padding:60px 10px;text-align:center;border:1.5px dashed var(--line);border-radius:20px}
footer{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.8fr) minmax(0,1fr);gap:18px;align-items:center;padding:12px 20px}
.npw{display:flex;gap:14px;align-items:center;min-width:0}.npw .cv{width:56px;height:56px;border-radius:14px}
#np{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600;min-width:0}#np small{display:block;color:var(--mu);font-weight:400}
.ctl{display:flex;flex-direction:column;gap:6px;align-items:center}
.btns{display:flex;gap:8px;align-items:center}.btns button{width:38px;height:38px;border-radius:50%;color:var(--mu);font-size:17px}.btns button:hover{color:var(--tx);background:rgba(255,255,255,.08)}.btns button.on{color:var(--ac)}
.btns .play{width:50px;height:50px;background:var(--g);color:#0d0b18;font-size:19px;text-shadow:none;box-shadow:0 8px 24px hsl(var(--h) 90% 55%/calc(.45*var(--glow)))}.btns .play:hover{transform:scale(1.1);color:#0d0b18}
.seek{display:flex;gap:10px;align-items:center;width:100%;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--ac) var(--p,0%),rgba(255,255,255,.18) var(--p,0%));accent-color:var(--ac);cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px hsl(var(--h) 85% 62%/.3);transition:.15s}input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.25)}
.vol{display:flex;gap:10px;align-items:center;justify-content:flex-end}.vol input{max-width:120px}
.modal{position:fixed;inset:0;z-index:5;background:rgba(5,4,12,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}
.card{background:#16142a;border:1px solid var(--line);border-radius:24px;padding:24px;width:min(640px,100%);max-height:92vh;overflow:auto;animation:pop .22s;text-shadow:none}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.card h3{margin:0 0 14px;font-size:22px;letter-spacing:-.02em}.sec{margin:18px 0 8px;font-weight:600;font-size:16px}
#wf{width:100%;height:110px;display:block;border-radius:12px;background:rgba(255,255,255,.05)}
.f{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;margin:10px 0;color:var(--mu)}.f output{font-variant-numeric:tabular-nums;color:var(--tx)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.b{padding:10px 18px;border-radius:30px;background:rgba(255,255,255,.1)}.b:hover{background:rgba(255,255,255,.18)}.b.p{background:var(--g);color:#0d0b18;font-weight:600}
.opts{display:flex;gap:6px;flex-wrap:wrap}.opts button{padding:7px 14px;border-radius:30px;background:rgba(255,255,255,.08)}.opts button.on{background:var(--ac);color:#0d0b18}
.plr{display:flex;gap:10px;align-items:center;padding:6px 0}.plr b{font-size:20px;letter-spacing:.1em;color:var(--ac)}.plr span{flex:1;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.plr button{color:var(--mu);padding:4px 8px}
#plcode{font-size:46px;font-weight:700;letter-spacing:.22em;color:var(--ac);margin-top:10px}.pin{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:10px 14px;width:100%;margin-top:6px}
.back{display:none;position:fixed;z-index:7;top:calc(12px + env(safe-area-inset-top,0px));left:12px;padding:10px 18px;border-radius:30px;background:rgba(14,12,26,.7);backdrop-filter:blur(10px);border:1px solid var(--line);animation:pop .25s}body.ui-off .back{display:block}
body.ui-off aside,body.ui-off main{opacity:0;pointer-events:none}
#set{background:transparent;backdrop-filter:none;justify-content:flex-end;pointer-events:none}#set .card{pointer-events:auto;background:rgba(18,16,36,.88);backdrop-filter:blur(14px);width:min(400px,100%)}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;padding:8px;gap:8px}aside{flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}.logo{margin:0 6px 0 0;font-size:24px}.nav span{display:none}.nav{padding:4px}.drop{margin:0;padding:8px 12px}.drop span,.sp,#status{display:none}main{padding:16px}.hero .cv{width:84px;height:84px;font-size:36px}h2{font-size:30px}footer{grid-template-columns:1fr;gap:8px;padding:10px 14px}.vol{display:none}.npw .cv{width:44px;height:44px}.search{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.ps-solid aside,body.ps-solid main,body.ps-solid footer{background:#14122a;backdrop-filter:none;-webkit-backdrop-filter:none}body.ps-line aside,body.ps-line main,body.ps-line footer{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-color:rgba(255,255,255,.3);box-shadow:none}
.nocv .cv{display:none}.nocv .row{grid-template-columns:1fr auto auto}.noeq .eq{display:none!important}.nohero .hero{display:none}
body.slim{--sw:88px}.slim .nav span,.slim .drop span,.slim #status{display:none}.slim .nav{justify-content:center}.slim .logo{font-size:0;justify-content:center}.slim .drop b{font-size:20px}
#set .card{padding:16px;width:min(330px,100%);border-radius:22px}
.tabs{display:flex;gap:2px;margin-bottom:14px;background:rgba(255,255,255,.07);padding:3px;border-radius:30px}.tabs button{flex:1;padding:7px 4px;border-radius:30px;color:var(--mu);font-size:13px}.tabs button.on{background:rgba(255,255,255,.16);color:var(--tx)}
.pane{display:none}.pane.on{display:block}
.sw{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.sw button{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}.sw button:hover{transform:scale(1.18)}
#set .f{grid-template-columns:100px 1fr 38px;margin:7px 0;font-size:13px;gap:8px}#set .opts{gap:4px}#set .opts button,#set .opts .b{font-size:12.5px;padding:5px 11px;background:rgba(255,255,255,.07);border-radius:30px}#set .opts button.on{background:var(--ac);color:#0d0b18}
#set details{margin-top:6px;color:var(--mu);font-size:13px}#set summary{cursor:pointer;padding:4px 0}
#set .btnrow{margin-top:14px}#set .btnrow .b{padding:6px 14px;font-size:13px}
</style></head><body>
<canvas id="bg"></canvas>
<button class="back" id="back">Oberfläche wieder anzeigen</button>
<div class="app">
<aside>
<h1 class="logo">Echo</h1>
<button class="nav on" data-f="all"><i>♫</i><span>Bibliothek</span></button>
<button class="nav" data-f="liked"><i>♥</i><span>Gefällt mir</span></button>
<label class="drop" id="drop" tabindex="0"><b>＋ Video hochladen</b><span>Ziehen oder klicken, wird zu MP3</span><input id="file" type="file" accept="video/*,audio/*" multiple hidden></label>
<div id="status"></div><div id="bar"><i></i></div>
<div class="sp"></div>
<button class="nav" id="plBtn"><i>☰</i><span>Playlists &amp; Code</span></button>
<button class="nav" id="setBtn"><i>✦</i><span>Design anpassen</span></button>
</aside>
<main>
<div class="hero"><span class="cv"><u style="text-decoration:none">♫</u></span><div><small>DEINE MUSIK</small><h2 id="title">Bibliothek</h2><p id="meta"></p></div></div>
<div class="bar2"><button class="bigplay" id="playall" title="Alles abspielen">▶</button><input class="search" id="q" placeholder="Suchen" aria-label="Suchen"></div>
<div id="list"></div>
</main>
<footer>
<div class="npw"><span class="cv" id="npc"><u style="text-decoration:none">♫</u></span><div id="np">Nichts spielt<small>Lade ein Video hoch</small></div></div>
<div class="ctl">
<div class="btns"><button id="shuf" title="Zufällig">⇄</button><button id="prev" title="Zurück">⏮</button><button id="pp" class="play" title="Abspielen">▶</button><button id="next" title="Weiter">⏭</button><button id="rep" title="Wiederholen">↻</button><button id="eye" title="Nur Hintergrund zeigen (H)">👁</button></div>
<div class="seek"><span id="cu">0:00</span><input type="range" id="sk" min="0" max="1000" value="0" aria-label="Position"><span id="du">0:00</span></div>
</div>
<div class="vol"><span>🔊</span><input type="range" id="vo" min="0" max="100" value="80" aria-label="Lautstärke"></div>
</footer>
</div>

<div class="modal" id="trim"><div class="card">
<h3 id="tt">Kürzen</h3><canvas id="wf" width="600" height="110"></canvas>
<div class="f"><span>Start</span><input type="range" id="ts" min="0" max="1000" value="0"><output id="tso">0:00</output></div>
<div class="f"><span>Ende</span><input type="range" id="te" min="0" max="1000" value="1000"><output id="teo">0:00</output></div>
<div class="btnrow"><button class="b" id="tpv">▶ Vorschau</button><button class="b p" id="tnew">Als neuen Track speichern</button><button class="b" id="trep">Original ersetzen</button><button class="b" id="tx">Schließen</button></div>
<div id="tst" style="color:var(--mu);margin-top:10px;font-size:13px"></div>
</div></div>

<div class="modal" id="set"><div class="card">
<div class="tabs"><button class="on" data-tab="c">Farbe</button><button data-tab="b">Hintergrund</button><button data-tab="o">Oberfläche</button></div>
<div class="pane on" data-pane="c">
<div class="sw" id="pres"><button data-p="neon" title="Neon" style="background:hsl(300 85% 62%)"></button><button data-p="sunset" title="Sonnenuntergang" style="background:hsl(15 85% 62%)"></button><button data-p="ozean" title="Ozean" style="background:hsl(200 85% 62%)"></button><button data-p="wald" title="Wald" style="background:hsl(145 85% 62%)"></button><button data-p="eis" title="Eis" style="background:hsl(185 85% 62%)"></button><button data-p="rose" title="Rosé" style="background:hsl(335 85% 62%)"></button><button data-p="gold" title="Gold" style="background:hsl(45 85% 62%)"></button><button data-p="lava" title="Lava" style="background:hsl(5 85% 62%)"></button><button data-p="mint" title="Mint" style="background:hsl(165 85% 62%)"></button><button data-p="mono" title="Mono" style="background:hsl(220 8% 62%)"></button></div>
<div id="slc"></div>
<div class="opts" style="margin-top:10px"><button data-t="dyn">Farbe vom Cover</button><button id="srnd">Zufall</button></div>
</div>
<div class="pane" data-pane="b">
<div class="opts" id="modes"><button data-m="blobs">Blasen</button><button data-m="aurora">Aurora</button><button data-m="stars">Sterne</button><button data-m="rain">Funken</button><button data-m="waves">Wellen</button><button data-m="grid">Gitter</button><button data-m="bubbles">Ringe</button><button data-m="off">Aus</button></div>
<div id="sl1" style="margin-top:8px"></div>
<details><summary>Mehr</summary><div id="sl1b"></div></details>
<div class="opts" style="margin-top:10px"><button data-t="react">Reagiert auf Musik</button><button data-t="ui">Nur Hintergrund</button></div>
<div class="opts" style="margin-top:6px"><label class="b" style="cursor:pointer">Eigenes Bild<input type="file" id="bif" accept="image/*" hidden></label><button id="bix">Bild entfernen</button></div>
</div>
<div class="pane" data-pane="o">
<div class="opts" id="pst"><button data-ps="glas">Glas</button><button data-ps="solid">Solide</button><button data-ps="linie">Linien</button></div>
<div id="sl2" style="margin-top:8px"></div>
<details><summary>Mehr</summary><div id="sl2b"></div>
<div class="opts" style="margin-top:8px"><button data-t="nocv">Ohne Cover</button><button data-t="noeq">Ohne Equalizer</button><button data-t="nohero">Ohne Kopfbereich</button><button data-t="slim">Schmale Leiste</button></div></details>
<div class="opts" id="fonts" style="margin-top:10px"><button data-f="Outfit">Outfit</button><button data-f="Grotesk">Grotesk</button><button data-f="Sora">Sora</button><button data-f="Nunito">Nunito</button><button data-f="Serif">Serif</button><button data-f="Mono">Mono</button></div>
</div>
<div class="btnrow"><button class="b" id="sr">Zurücksetzen</button><button class="b p" id="sx">Fertig</button></div>
</div></div>

<div class="modal" id="pl"><div class="card">
<h3>Playlists &amp; Code</h3>
<div class="sec" style="margin-top:0">Playlist speichern</div>
<div style="color:var(--mu);font-size:13px">Speichert die Tracks der aktuellen Ansicht (Bibliothek oder Gefällt mir) und gibt dir einen 4-stelligen Code.</div>
<input class="pin" id="plname" placeholder="Name (optional)" maxlength="60">
<div class="btnrow" style="margin-top:10px"><button class="b p" id="plsave">Code erzeugen</button></div>
<div id="plcode"></div>
<div class="sec">Mit Code laden</div>
<input class="pin" id="plin" inputmode="numeric" maxlength="4" placeholder="4-stelliger Code">
<div class="btnrow" style="margin-top:10px"><button class="b p" id="plload">Laden</button></div>
<div id="plmsg" style="color:var(--mu);margin-top:10px;min-height:20px"></div>
<div class="sec">Meine Playlists</div><div id="plmine"></div>
<div class="btnrow"><button class="b" id="plx">Schließen</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s),fmt=s=>{s=Math.max(0,s|0);return(s/60|0)+":"+String(s%60).padStart(2,"0")};
let tracks=[],cur=-1,shuf=false,rep=0,filter="all",q="",order=[];
const au=new Audio();au.volume=.8;
// ---------- Speicher ----------
const dbp=new Promise(r=>{try{const o=indexedDB.open("echo",1);o.onupgradeneeded=()=>o.result.createObjectStore("t",{keyPath:"id"});o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)}catch(e){r(null)}});
async function putLocal(t){const d=await dbp;if(d)try{d.transaction("t","readwrite").objectStore("t").put(t)}catch(e){}}
async function rmLocal(id){const d=await dbp;if(d)try{d.transaction("t","readwrite").objectStore("t").delete(id)}catch(e){}}
async function loadLocal(){const d=await dbp;if(!d)return[];return new Promise(r=>{try{const g=d.transaction("t").objectStore("t").getAll();g.onsuccess=()=>r(g.result);g.onerror=()=>r([])}catch(e){r([])}})}
// ---------- Dauerhafter Speicher (Cloud) ----------
let CL=null;
async function initCloud(){try{if(!(window.claude&&claude.use))return;const[db,assets,user]=await Promise.all([claude.use("db"),claude.use("assets"),claude.use("user")]);if(db&&assets&&user){const uid=await user.id();if(uid)CL={db,assets,col:db.collection("data/users/"+uid)}}}catch(e){CL=null}}
async function put(t){
 if(CL){try{if(!t.aid&&t.blob){const r=await CL.assets.upload(t.blob);t.aid=r.id}
  await CL.col.doc("t_"+t.id).set({name:t.name,dur:t.dur,liked:!!t.liked,added:t.added,aid:t.aid});return true}catch(e){console.error(e)}}
 if(t.blob){await putLocal(t);return !CL}return false}
async function rm(t){if(CL){try{await CL.col.doc("t_"+t.id).delete();if(t.aid&&!(await aidUsed(t.aid)))await CL.assets.delete(t.aid)}catch(e){}}rmLocal(t.id)}
async function loadAll(){if(!CL)return loadLocal();try{const sn=await CL.col.get();return sn.docs.filter(d=>d.id.startsWith("t_")).map(d=>({id:d.id.slice(2),...d.data()}))}catch(e){return loadLocal()}}
async function aidUsed(aid){if(tracks.some(t=>t.aid===aid))return true;try{const sn=await CL.db.collection("playlists").get();return sn.docs.some(d=>(d.data().tracks||[]).some(x=>x.aid===aid))}catch(e){return true}}
async function getBlob(t){if(t.blob)return t.blob;const r=await fetch("/_blob/"+t.aid);return await r.blob()}
async function migrate(){const loc=await loadLocal();for(const t of loc){if(tracks.some(x=>x.id===t.id))continue;tracks.push(t);if(await put(t))rmLocal(t.id)}render()}
// ---------- MP3 ----------
const tick=()=>new Promise(r=>setTimeout(r,0));
async function encode(buf,s,e,prog,br){
 const ch=buf.numberOfChannels>1?2:1,sr=buf.sampleRate,enc=new lamejs.Mp3Encoder(ch,sr,br||128),out=[];
 const a=Math.floor(s*sr),b=Math.min(buf.length,Math.floor(e*sr)),L=buf.getChannelData(0),R=ch>1?buf.getChannelData(1):null,step=1152*20;
 const cv=x=>{const o=new Int16Array(x.length);for(let i=0;i<x.length;i++){const v=Math.max(-1,Math.min(1,x[i]));o[i]=v<0?v*32768:v*32767}return o};
 for(let i=a;i<b;i+=step){const j=Math.min(b,i+step),d=enc.encodeBuffer(cv(L.subarray(i,j)),R?cv(R.subarray(i,j)):undefined);if(d.length)out.push(new Uint8Array(d));if(prog)prog((i-a)/(b-a));await tick()}
 const f=enc.flush();if(f.length)out.push(new Uint8Array(f));
 return new Blob(out,{type:"audio/mpeg"});
}
async function decode(ab){const ac=new(window.AudioContext||window.webkitAudioContext)();try{return await ac.decodeAudioData(ab)}finally{ac.close()}}
function status(t,p){$("#status").textContent=t;const b=$("#bar");b.style.display=p==null?"none":"block";if(p!=null)b.firstChild.style.width=p*100+"%"}
async function addFiles(files){
 for(const f of files){
  try{status("Lese "+f.name+" …",0);const buf=await decode(await f.arrayBuffer());
   const br=buf.duration<=1140?128:buf.duration<=1560?96:64,blob=await encode(buf,0,buf.duration,p=>status("Wandle um: "+f.name,p),br);
   const t={id:Date.now()+"-"+Math.random().toString(36).slice(2,6),name:f.name.replace(/\.[^.]+$/,""),blob,dur:buf.duration,liked:false,added:Date.now()};
   tracks.push(t);render();status("Speichere "+t.name+" …",null);const ok=await put(t);status(ok?"Fertig und gespeichert: "+t.name:"Nur temporär im Browser: "+t.name+(blob.size>20971520?" (zu lang für den Dauerspeicher, max. ca. 20 MB)":""),null)}
  catch(e){status("Fehler bei "+f.name+": Datei konnte nicht gelesen werden. Versuche MP4 oder WebM.",null)}
 }
}

let tb=null,tt=null,pv=null,peaks=[];
async function openTrim(t){
 tt=t;$("#trim").classList.add("show");$("#tt").textContent="Kürzen: "+t.name;$("#tst").textContent="Lade Wellenform …";
 t.blob=await getBlob(t);tb=await decode(await t.blob.arrayBuffer());const d=tb.getChannelData(0),n=600,sz=Math.floor(d.length/n);peaks=[];
 for(let i=0;i<n;i++){let m=0;for(let j=i*sz;j<(i+1)*sz;j+=8)m=Math.max(m,Math.abs(d[j]||0));peaks.push(m)}
 $("#ts").value=0;$("#te").value=1000;$("#tst").textContent="";drawWf();
}
function drawWf(){
 const c=$("#wf"),x=c.getContext("2d"),s=$("#ts").value/1000,e=$("#te").value/1000,w=c.width,h=c.height;
 x.clearRect(0,0,w,h);const ac=getComputedStyle(document.documentElement).getPropertyValue("--h");
 peaks.forEach((p,i)=>{const on=i/w>=s&&i/w<=e;x.fillStyle=on?`hsl(${ac} 85% 65%)`:"rgba(255,255,255,.2)";const bh=Math.max(2,p*h*.95);x.fillRect(i,(h-bh)/2,1,bh)});
 $("#tso").textContent=fmt(s*tb.duration);$("#teo").textContent=fmt(e*tb.duration);
}

document.addEventListener("click",e=>{const m=$("#set");if(m.classList.contains("show")&&!e.target.closest("#set .card")&&!e.target.closest("#setBtn"))m.classList.remove("show")});
let BI=null;try{const u=localStorage.getItem("echo-bi");if(u){BI=new Image();BI.src=u}}catch(e){}
$("#bif").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const u=c.toDataURL("image/jpeg",.8);BI=new Image();BI.src=u;try{localStorage.setItem("echo-bi",u)}catch(x){}};im.src=URL.createObjectURL(f)};
$("#bix").onclick=()=>{BI=null;try{localStorage.removeItem("echo-bi")}catch(e){}};
$("#srnd").onclick=()=>{S.hue=Math.floor(Math.random()*360);S.sp=20+Math.floor(Math.random()*110);S.mode=["blobs","aurora","stars","rain","waves","grid","bubbles"][Math.floor(Math.random()*7)];applyS()};
let an=null,fd=null,lv=0;
function initAn(){if(an)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),sr=c.createMediaElementSource(au);an=c.createAnalyser();an.fftSize=256;sr.connect(an);an.connect(c.destination);fd=new Uint8Array(an.frequencyBinCount);window._ac=c}catch(e){an=null}}
const cv=$("#bg"),g=cv.getContext("2d");let W,H,T=0;
function size(){const r=devicePixelRatio>1?1.5:1;W=cv.width=innerWidth/ (r>1?1:1);H=cv.height=innerHeight}
addEventListener("resize",size);size();
const P=Array.from({length:300},()=>({x:Math.random(),y:Math.random(),z:Math.random()}));
const rm_=matchMedia("(prefers-reduced-motion:reduce)").matches;
function frame(){
 let tl=0;if(an&&!au.paused&&S.react){an.getByteFrequencyData(fd);let q=0;for(let i=0;i<12;i++)q+=fd[i];tl=q/12/255}lv+=(tl-lv)*.2;const boost=(au.paused?1:1.5)*(1+lv*1.5),sp=S.spd/100*boost,it=S.int/100*(1+lv*.7);T+=.006*sp*(rm_?0:1);
 g.globalCompositeOperation="source-over";g.fillStyle=`hsl(${S.hue} 45% ${S.base}%)`;g.fillRect(0,0,W,H);
 if(BI&&BI.complete&&BI.width){const r=Math.max(W/BI.width,H/BI.height);g.drawImage(BI,(W-BI.width*r)/2,(H-BI.height*r)/2,BI.width*r,BI.height*r)}g.globalCompositeOperation="lighter";const h=EH;
 if(S.mode==="blobs"){for(let i=0;i<6;i++){const x=W*(.5+.42*Math.sin(T*(.6+i*.17)+i*2)),y=H*(.5+.4*Math.cos(T*(.5+i*.13)+i)),r=Math.max(W,H)*(.28+.06*Math.sin(T+i))*(1+lv*.3),
   gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`hsla(${h+i*S.sp*.76},85%,55%,${.38*Math.min(it,1.6)})`);gr.addColorStop(1,"hsla(0,0%,0%,0)");g.fillStyle=gr;g.fillRect(0,0,W,H)}}
 else if(S.mode==="aurora"){for(let k=0;k<4;k++){g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=24){const y=H*.45+Math.sin(x*.004+T*(1+k*.3)+k)*H*.12+Math.sin(x*.011-T*1.3)*H*.05+k*H*.06;g.lineTo(x,y)}g.lineTo(W,H);g.closePath();
   const gr=g.createLinearGradient(0,H*.3,0,H);gr.addColorStop(0,`hsla(${h+k*S.sp*.8},90%,60%,${.28*it})`);gr.addColorStop(1,"hsla(0,0%,0%,0)");g.fillStyle=gr;g.fill()}}
 else if(S.mode==="stars"){P.slice(0,S.cnt).forEach(p=>{p.z-=.0015*sp*(rm_?0:1);if(p.z<=.02)p.z=1;const x=W/2+(p.x-.5)*W/p.z*.5,y=H/2+(p.y-.5)*H/p.z*.5,s=(1-p.z)*3.2;g.fillStyle=`hsla(${h+p.x*S.sp*1.6},90%,${65+p.z*10}%,${Math.min(1,it*(1-p.z))})`;g.beginPath();g.arc(x,y,s,0,7);g.fill()});
   const gr=g.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.6);gr.addColorStop(0,`hsla(${h},80%,40%,${.25*it})`);gr.addColorStop(1,"hsla(0,0%,0%,0)");g.fillStyle=gr;g.fillRect(0,0,W,H)}
 else if(S.mode==="rain"){P.slice(0,S.cnt).forEach(p=>{p.y-=.0016*sp*(.4+p.z)*(rm_?0:1);if(p.y<-.05){p.y=1.05;p.x=Math.random()}const x=p.x*W+Math.sin(T*2+p.z*9)*18,y=p.y*H,s=1+p.z*4;
   const gr=g.createRadialGradient(x,y,0,x,y,s*5);gr.addColorStop(0,`hsla(${h+p.z*S.sp*1.4},95%,65%,${.8*it})`);gr.addColorStop(1,"hsla(0,0%,0%,0)");g.fillStyle=gr;g.fillRect(x-s*5,y-s*5,s*10,s*10)})}
 if(S.mode==="waves"){for(let k=0;k<5;k++){g.beginPath();for(let x=0;x<=W;x+=12){const y=H*(.3+k*.14)+Math.sin(x*.006+T*(1.2+k*.25)+k*2)*H*.06*(1+lv);x?g.lineTo(x,y):g.moveTo(x,y)}g.strokeStyle=`hsla(${h+k*S.sp*.5},90%,62%,${.55*it})`;g.lineWidth=2.5+k;g.stroke()}}
else if(S.mode==="grid"){const hz=H*.45;g.strokeStyle=`hsla(${h},90%,60%,${.5*it})`;g.lineWidth=1.4;for(let i=-20;i<=20;i++){g.beginPath();g.moveTo(W/2+i*W*.02,hz);g.lineTo(W/2+i*W*.18,H);g.stroke()}for(let j=0;j<14;j++){const p=((j+T*2)%14)/14,y=hz+(H-hz)*p*p;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}const gr=g.createRadialGradient(W/2,hz,0,W/2,hz,H*.32*(1+lv*.3));gr.addColorStop(0,`hsla(${h+S.sp},95%,60%,${.6*it})`);gr.addColorStop(1,"hsla(0,0%,0%,0)");g.fillStyle=gr;g.fillRect(0,0,W,H)}
else if(S.mode==="bubbles"){P.slice(0,S.cnt).forEach(p=>{p.y-=.0007*sp*(.5+p.z)*(rm_?0:1);if(p.y<-.1){p.y=1.1;p.x=Math.random()}const r=(8+p.z*46)*(1+lv*.4),x=p.x*W+Math.sin(T+p.z*20)*20,y=p.y*H,c=h+p.z*S.sp;g.strokeStyle=`hsla(${c},90%,70%,${.55*it})`;g.lineWidth=2;g.beginPath();g.arc(x,y,r,0,7);g.stroke();const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,"hsla(0,0%,0%,0)");gr.addColorStop(1,`hsla(${c},90%,65%,${.18*it})`);g.fillStyle=gr;g.fill()})}
g.globalCompositeOperation="source-over";requestAnimationFrame(frame);
}
applyS();frame();
// Start
render();
